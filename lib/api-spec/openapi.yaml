openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /sync/metadata/status:
    get:
      operationId: getMetadataStatus
      summary: Independent metadata worker status and recent runs
      responses:
        "200":
          description: Metadata status for the current scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetadataStatus" }
        "401": { $ref: "#/components/responses/ShufflrrError" }
        "503": { $ref: "#/components/responses/ShufflrrError" }
  /sync/metadata/refresh:
    post:
      operationId: requestMetadataRefresh
      summary: Coalesce a metadata-only refresh request without transferring files
      responses:
        "202":
          description: Refresh requested
          content:
            application/json:
              schema:
                type: object
                required: [requestedAt]
                properties:
                  requestedAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/ShufflrrError" }
        "401": { $ref: "#/components/responses/ShufflrrError" }
        "503": { $ref: "#/components/responses/ShufflrrError" }
  /sync/metadata/events:
    get:
      operationId: getMetadataEvents
      summary: Read a fixed metadata run independently of file activity
      parameters:
        - { in: query, name: runId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: after, schema: { type: integer, minimum: 0 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200":
          description: Metadata event page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetadataEventPage" }
        "400": { $ref: "#/components/responses/ShufflrrError" }
        "401": { $ref: "#/components/responses/ShufflrrError" }
        "404": { $ref: "#/components/responses/ShufflrrError" }
        "503": { $ref: "#/components/responses/ShufflrrError" }
  /sync/metadata/file:
    get:
      operationId: getFileMetadata
      summary: Retrieve the source metadata associated with a SharePoint identity
      parameters:
        - { in: query, name: driveId, required: true, schema: { type: string, minLength: 1, maxLength: 500 } }
        - { in: query, name: itemId, required: true, schema: { type: string, minLength: 1, maxLength: 500 } }
      responses:
        "200":
          description: Last good snapshot and its refresh state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FileMetadataRecord" }
        "400": { $ref: "#/components/responses/ShufflrrError" }
        "401": { $ref: "#/components/responses/ShufflrrError" }
        "404": { $ref: "#/components/responses/ShufflrrError" }
        "503": { $ref: "#/components/responses/ShufflrrError" }
  /sync/runs:
    get:
      operationId: getSyncRuns
      summary: Read the most recent fifty sync runs
      responses:
        "200":
          description: Newest runs first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SyncRun" }
        "401": { $ref: "#/components/responses/ShufflrrError" }
        "503": { $ref: "#/components/responses/ShufflrrError" }
  /sync/events:
    get:
      operationId: getSyncRunEvents
      summary: Read paginated per-item outcomes for a sync run
      parameters:
        - in: query
          name: runId
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/SyncEventStatus" }
        - in: query
          name: after
          schema: { type: integer, minimum: 0 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        "200":
          description: Events with full-run status counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncEventPage" }
        "400": { $ref: "#/components/responses/ShufflrrError" }
        "401": { $ref: "#/components/responses/ShufflrrError" }
        "404": { $ref: "#/components/responses/ShufflrrError" }
        "503": { $ref: "#/components/responses/ShufflrrError" }
  /sync/dashboard:
    get:
      operationId: getSyncDashboard
      summary: Read scoped file totals from the latest full sync inventory
      responses:
        "200":
          description: Last complete scan of the currently configured sync scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncDashboard"
        "401": { $ref: "#/components/responses/ShufflrrError" }
        "503": { $ref: "#/components/responses/ShufflrrError" }
  /sync/config:
    get:
      operationId: getSyncConfig
      summary: Read the shared Shufflrr to SharePoint sync configuration
      responses:
        "200":
          description: Shared sync configuration and status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncConfig" }
        "401": { $ref: "#/components/responses/ShufflrrError" }
        "503": { $ref: "#/components/responses/ShufflrrError" }
    put:
      operationId: saveSyncConfig
      summary: Save the shared sync folders while sync is disabled
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncConfigInput" }
      responses:
        "200":
          description: Updated shared sync configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncConfig" }
        "400": { $ref: "#/components/responses/ShufflrrError" }
        "401": { $ref: "#/components/responses/ShufflrrError" }
        "409": { $ref: "#/components/responses/ShufflrrError" }
        "503": { $ref: "#/components/responses/ShufflrrError" }
  /sync/resolutions:
    post:
      operationId: resolveSyncConflicts
      summary: Approve overwrite on the next sync or persistently ignore selected files
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncResolutionInput" }
      responses:
        "204": { description: Resolution choices saved; no provider content changed }
        "400": { $ref: "#/components/responses/ShufflrrError" }
        "401": { $ref: "#/components/responses/ShufflrrError" }
        "409": { $ref: "#/components/responses/ShufflrrError" }
        "503": { $ref: "#/components/responses/ShufflrrError" }
  /sync/ignored:
    get:
      operationId: getSyncIgnoredFiles
      summary: List persistent file ignore rules, including detached mappings
      responses:
        "200":
          description: Ignored files
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SyncIgnoredFile" } }
        "401": { $ref: "#/components/responses/ShufflrrError" }
        "503": { $ref: "#/components/responses/ShufflrrError" }
  /sync/ignored/reenable:
    post:
      operationId: reenableSyncFiles
      summary: Remove selected ignore rules without overwriting or starting sync
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncRuleSelection" }
      responses:
        "204": { description: Rules removed; normal conflict protection restored }
        "400": { $ref: "#/components/responses/ShufflrrError" }
        "401": { $ref: "#/components/responses/ShufflrrError" }
        "409": { $ref: "#/components/responses/ShufflrrError" }
        "503": { $ref: "#/components/responses/ShufflrrError" }
  /sync/disconnect:
    post:
      operationId: disconnectSync
      summary: Disconnect saved sync folders without deleting files, mappings, or history
      responses:
        "200":
          description: Unconfigured paused sync state with retained notices
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncConfig" }
        "401": { $ref: "#/components/responses/ShufflrrError" }
        "409": { $ref: "#/components/responses/ShufflrrError" }
        "503": { $ref: "#/components/responses/ShufflrrError" }
  /sync/failures:
    get:
      operationId: getSyncFailures
      tags: [Sync]
      parameters:
        - { name: after, in: query, schema: { type: integer, minimum: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: includeDismissed, in: query, schema: { type: string, enum: ["yes"] } }
      responses:
        "200":
          description: Undismissed unresolved file failures
          content:
            application/json:
              schema:
                type: object
                required: [failures, total, nextAfter, retryableCount, canRetryAll]
                properties:
                  failures:
                    type: array
                    items: { $ref: "#/components/schemas/SyncFileFailure" }
                  total: { type: integer }
                  nextAfter: { type: integer, nullable: true }
                  retryableCount: { type: integer }
                  canRetryAll: { type: boolean }
  /sync/failures/retry-all:
    post:
      operationId: retryAllSyncFiles
      tags: [Sync]
      summary: Queue all visible unresolved in-scope files after a run finishes
      responses:
        "202":
          description: Retries queued across all pages; respects provider cooldowns
          content:
            application/json:
              schema:
                type: object
                required: [queuedCount, clearedCount, retryAt]
                properties:
                  queuedCount: { type: integer }
                  clearedCount: { type: integer }
                  retryAt: { type: string, format: date-time }
                  queuedAt: { type: string, format: date-time }
        "409":
          description: A sync is currently running
  /sync/failures/{id}/sharepoint/{target}:
    get:
      operationId: getSyncFailureSharePointLink
      summary: Resolve the existing SharePoint target file or parent folder browser link
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: target, in: path, required: true, schema: { type: string, enum: [file, folder] } }
      responses:
        "200":
          description: Verified destination browser link
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
        "400": { $ref: "#/components/responses/ShufflrrError" }
        "401": { $ref: "#/components/responses/ShufflrrError" }
        "404": { $ref: "#/components/responses/ShufflrrError" }
        "409": { $ref: "#/components/responses/ShufflrrError" }
        "502": { $ref: "#/components/responses/ShufflrrError" }
        "503": { $ref: "#/components/responses/ShufflrrError" }
  /sync/failures/{id}/dismiss:
    put:
      operationId: dismissSyncFileFailure
      tags: [Sync]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "204": { description: Failure banner dismissed }
  /sync/failures/dismiss-all:
    post:
      operationId: dismissAllSyncFailures
      tags: [Sync]
      summary: Dismiss every currently visible unresolved file notice
      responses:
        "200":
          description: The number of notices dismissed across all pages
          content:
            application/json:
              schema:
                type: object
                required: [clearedCount]
                properties:
                  clearedCount: { type: integer }
  /sync/failures/{id}/retry:
    post:
      operationId: retrySyncFile
      tags: [Sync]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "202":
          description: Targeted retry queued; respects provider cooldowns
          content:
            application/json:
              schema:
                type: object
                required: [retryAt]
                properties:
                  retryAt: { type: string, format: date-time }
  /sync/interval:
    put:
      operationId: setSyncInterval
      summary: Set the shared Shufflrr polling interval without changing folders
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncPollingInput" }
      responses:
        "200":
          description: Updated polling interval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncConfig" }
        "400": { $ref: "#/components/responses/ShufflrrError" }
        "401": { $ref: "#/components/responses/ShufflrrError" }
        "503": { $ref: "#/components/responses/ShufflrrError" }
  /sync/enabled:
    put:
      operationId: setSyncEnabled
      summary: Enable or pause scheduled synchronization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncEnabledInput" }
      responses:
        "200":
          description: Updated sync state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncConfig" }
        "400": { $ref: "#/components/responses/ShufflrrError" }
        "401": { $ref: "#/components/responses/ShufflrrError" }
        "503": { $ref: "#/components/responses/ShufflrrError" }
  /sync/run-now:
    post:
      operationId: requestSyncNow
      summary: Request an immediate run without changing the polling interval
      responses:
        "202":
          description: Run queued immediately, subject to provider cooldowns
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncConfig" }
        "400": { $ref: "#/components/responses/ShufflrrError" }
        "401": { $ref: "#/components/responses/ShufflrrError" }
        "409":
          description: Sync is paused or another run is active
          $ref: "#/components/responses/ShufflrrError"
        "503": { $ref: "#/components/responses/ShufflrrError" }
  /sync/orphans/{id}:
    delete:
      operationId: dismissSyncOrphan
      summary: Acknowledge and dismiss a detached sync pair notice
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { description: Notice dismissed }
        "401": { $ref: "#/components/responses/ShufflrrError" }
        "404": { $ref: "#/components/responses/ShufflrrError" }
        "503": { $ref: "#/components/responses/ShufflrrError" }
  /shufflrr/items:
    get:
      operationId: listShufflrrItems
      summary: List accessible roots or one Shufflrr folder
      parameters:
        - in: query
          name: folderId
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Folder listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShufflrrListing" }
        "400": { $ref: "#/components/responses/ShufflrrError" }
        "401": { $ref: "#/components/responses/ShufflrrError" }
        "403": { $ref: "#/components/responses/ShufflrrError" }
        "502": { $ref: "#/components/responses/ShufflrrError" }
        "503": { $ref: "#/components/responses/ShufflrrError" }
  /shufflrr/files/{id}/download:
    get:
      operationId: downloadShufflrrFile
      summary: Download an accessible file through the authenticated server
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: File bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/ShufflrrError" }
        "401": { $ref: "#/components/responses/ShufflrrError" }
        "403": { $ref: "#/components/responses/ShufflrrError" }
        "502": { $ref: "#/components/responses/ShufflrrError" }
        "503": { $ref: "#/components/responses/ShufflrrError" }
  /shufflrr/session/end:
    post:
      operationId: endShufflrrSession
      tags: [Shufflrr]
      summary: Discard the Shufflrr connection for the current authenticated app session
      responses:
        "204":
          description: Connection discarded or no connection existed
        "401":
          $ref: "#/components/responses/ShufflrrError"
        "403":
          $ref: "#/components/responses/ShufflrrError"
        "502":
          $ref: "#/components/responses/ShufflrrError"
  /shufflrr/test:
    post:
      operationId: testShufflrrAccess
      summary: Verify read/write/delete with isolated temporary items in a selected root
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShufflrrProbeInput" }
      responses:
        "200":
          description: Scoped access report and cleanup status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShufflrrAccessReport" }
        "400": { $ref: "#/components/responses/ShufflrrError" }
        "401": { $ref: "#/components/responses/ShufflrrError" }
        "403": { $ref: "#/components/responses/ShufflrrError" }
        "502": { $ref: "#/components/responses/ShufflrrError" }
        "503": { $ref: "#/components/responses/ShufflrrError" }
  /sharepoint/status:
    get:
      operationId: getConnectionStatus
      summary: Credential presence and fixed library target
      responses:
        "200":
          description: Configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionStatus"
  /sharepoint/test:
    post:
      operationId: testConnection
      summary: Test authentication, site, library and file listing
      responses:
        "200":
          description: Diagnostic result including any access failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessReport"
  /sharepoint/items:
    get:
      operationId: listItems
      summary: Read a folder in the fixed library
      parameters:
        - in: query
          name: folderId
          schema: { type: string }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        "200":
          description: Folder listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderListing"
        "400":
          description: Invalid input
        "502":
          description: Access failed
  /sharepoint/folders:
    post:
      operationId: createSharePointFolder
      summary: Create a folder in the fixed library
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SharePointCreateFolderInput" }
      responses:
        "201":
          description: Created folder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryItem" }
        "400": { description: Invalid folder name or destination }
        "401": { description: Sign-in required }
        "403": { description: SharePoint denied the operation }
        "409": { description: An item with that name already exists }
        "502": { description: SharePoint request failed }
  /sharepoint/items/{itemId}:
    patch:
      operationId: updateSharePointItem
      summary: Rename or move an item in the fixed library
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string, minLength: 1, maxLength: 500 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SharePointUpdateItemInput" }
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryItem" }
        "400": { description: Invalid update or destination }
        "401": { description: Sign-in required }
        "403": { description: SharePoint denied the operation }
        "404": { description: Item not found }
        "409": { description: An item with that name already exists }
        "502": { description: SharePoint request failed }
    delete:
      operationId: deleteSharePointItem
      summary: Delete an item from the fixed library
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "204": { description: Item deleted }
        "401": { description: Sign-in required }
        "403": { description: SharePoint denied the operation }
        "404": { description: Item not found }
        "502": { description: SharePoint request failed }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  responses:
    ShufflrrError:
      description: Safe request or provider failure
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ShufflrrRequestError" }
  schemas:
    SourceMetadata:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: { type: integer }
        portalId: { type: ["integer", "null"] }
        name: { type: string }
        description: { type: ["string", "null"] }
        parentFolderId: { type: ["integer", "null"] }
        folderName: { type: ["string", "null"] }
        fileType: { type: ["string", "null"] }
        extension: { type: ["string", "null"] }
        author: { type: ["string", "null"] }
        size: { type: ["integer", "null"] }
        source: { type: ["string", "null"] }
        sourceId: { type: ["string", "null"] }
        createdDate: { type: ["string", "null"] }
        modifiedDate: { type: ["string", "null"] }
        createdById: { type: ["string", "null"] }
        createdByName: { type: ["string", "null"] }
        createdByEmail: { type: ["string", "null"] }
        modifiedById: { type: ["string", "null"] }
        modifiedByName: { type: ["string", "null"] }
        fileCreatedDate: { type: ["string", "null"] }
        fileModifiedDate: { type: ["string", "null"] }
    FileMetadataRecord:
      type: object
      required: [driveId, itemId, sourceFileId, fields, observedAt, lastAttemptAt, lastError, stale, mapped]
      properties:
        driveId: { type: string }
        itemId: { type: string }
        sourceFileId: { type: integer }
        fields:
          oneOf:
            - { $ref: "#/components/schemas/SourceMetadata" }
            - { type: "null" }
        observedAt: { type: ["string", "null"], format: date-time }
        lastAttemptAt: { type: string, format: date-time }
        lastError: { type: ["string", "null"] }
        stale: { type: boolean }
        mapped: { type: boolean }
    MetadataRun:
      type: object
      required: [id, status, startedAt, finishedAt, totalFiles, processedFiles, refreshedFiles, unchangedFiles, failedFiles, skippedFiles, sampleLimit, error]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [running, success, partial, failed] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: ["string", "null"], format: date-time }
        totalFiles: { type: integer }
        processedFiles: { type: integer }
        refreshedFiles: { type: integer }
        unchangedFiles: { type: integer }
        failedFiles: { type: integer }
        skippedFiles: { type: integer }
        sampleLimit: { type: ["integer", "null"] }
        error: { type: ["string", "null"] }
    MetadataStatus:
      type: object
      required: [configured, pending, workerLastSeenAt, nextCrawlAt, intervalSeconds, runs]
      properties:
        configured: { type: boolean }
        pending: { type: boolean }
        workerLastSeenAt: { type: ["string", "null"], format: date-time }
        nextCrawlAt: { type: ["string", "null"], format: date-time }
        intervalSeconds: { type: integer }
        runs: { type: array, items: { $ref: "#/components/schemas/MetadataRun" } }
    MetadataEvent:
      type: object
      required: [id, runId, driveId, itemId, name, status, message, occurredAt]
      properties:
        id: { type: integer }
        runId: { type: string, format: uuid }
        driveId: { type: string }
        itemId: { type: string }
        name: { type: string }
        status: { type: string, enum: [refreshed, unchanged, failed, skipped] }
        message: { type: string }
        occurredAt: { type: string, format: date-time }
    MetadataEventPage:
      type: object
      required: [events, nextAfter]
      properties:
        events: { type: array, items: { $ref: "#/components/schemas/MetadataEvent" } }
        nextAfter: { type: ["integer", "null"] }
    ShufflrrRequestError:
      type: object
      required: [error, requestId]
      properties:
        error: { type: string }
        requestId: { type: string }
    SyncEventStatus:
      type: string
      enum: [created, copied, updated, moved, deleted, unchanged, conflict, failed, skipped]
    SyncRun:
      type: object
      required: [id, startedAt, finishedAt, status, summary, error]
      properties:
        id: { type: string, format: uuid }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: ["string", "null"], format: date-time }
        status: { type: string, enum: [running, success, partial, failed] }
        summary: { oneOf: [{ $ref: "#/components/schemas/SyncSummary" }, { type: "null" }] }
        error: { type: ["string", "null"] }
    SyncLogEntry:
      type: object
      required: [id, status, path, destinationPath, itemType, message, occurredAt]
      properties:
        id: { type: integer }
        status: { $ref: "#/components/schemas/SyncEventStatus" }
        path: { type: ["string", "null"] }
        destinationPath: { type: ["string", "null"] }
        itemType: { type: string, enum: [file, folder, run] }
        message: { type: string }
        occurredAt: { type: string, format: date-time }
    SyncStatusCount:
      type: object
      required: [status, count]
      properties:
        status: { $ref: "#/components/schemas/SyncEventStatus" }
        count: { type: integer, minimum: 0 }
    SyncEventPage:
      type: object
      required: [events, counts, nextAfter]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/SyncLogEntry" }
        counts:
          type: array
          items: { $ref: "#/components/schemas/SyncStatusCount" }
        nextAfter: { type: ["integer", "null"] }
    SyncSourceFolder:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 255 }
    SyncResolutionInput:
      type: object
      required: [failureIds, action]
      properties:
        failureIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: integer, minimum: 1 }
        action: { type: string, enum: [overwrite, ignore] }
    SyncRuleSelection:
      type: object
      required: [ruleIds]
      properties:
        ruleIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: integer, minimum: 1 }
    SyncIgnoredFile:
      type: object
      required: [id, failureId, name, path, destinationFolderName, createdAt, active, fileUrl, parentFolderUrl]
      properties:
        id: { type: integer }
        failureId: { type: integer }
        name: { type: string }
        path: { type: string }
        destinationFolderName: { type: string }
        createdAt: { type: string, format: date-time }
        active: { type: boolean }
        fileUrl: { type: string }
        parentFolderUrl: { type: string }
    SyncFileFailure:
      type: object
      required: [id, name, path, reason, lastFailedAt, retryRequestedAt, fileUrl, parentFolderUrl, canRetry, issueCount, latestStatus, issues]
      properties:
        id: { type: integer }
        name: { type: string }
        path: { type: string }
        reason: { type: string }
        lastFailedAt: { type: string, format: date-time }
        retryRequestedAt: { type: string, format: date-time, nullable: true }
        fileUrl: { type: string, format: uri }
        parentFolderUrl: { type: string, format: uri }
        canRetry: { type: boolean }
        canResolve: { type: boolean }
        overwriteApproved: { type: boolean }
        issueCount: { type: integer, minimum: 0 }
        latestStatus: { type: string, enum: [failed, conflict, skipped] }
        issues:
          type: array
          items: { $ref: "#/components/schemas/SyncFileFailureIssue" }
    SyncFileFailureIssue:
      type: object
      required: [status, reason, occurredAt]
      properties:
        status: { type: string, enum: [failed, conflict, skipped] }
        reason: { type: string }
        occurredAt: { type: string, format: date-time }
    SyncFolderExclusion:
      type: object
      required: [id, name, rootId, ancestorIds]
      properties:
        id: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 255 }
        rootId: { type: integer, minimum: 1 }
        ancestorIds:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: integer, minimum: 1 }
    SyncConflict:
      type: object
      required: [path, kind]
      properties:
        path: { type: string }
        kind: { type: string, enum: [path-conflict, untracked-sharepoint-item] }
    SyncSummary:
      type: object
      required: [createdFolders, copiedFiles, updatedFiles, deletedItems, conflicts]
      properties:
        archivedFiles: { type: integer, minimum: 0 }
        runKind: { type: string, enum: [full, retry] }
        createdFolders: { type: integer, minimum: 0 }
        copiedFiles: { type: integer, minimum: 0 }
        updatedFiles: { type: integer, minimum: 0 }
        deletedItems: { type: integer, minimum: 0 }
        conflicts: { type: integer, minimum: 0 }
        fileProgress:
          oneOf:
            - $ref: "#/components/schemas/SyncFileProgress"
            - { type: "null" }
    SyncFileProgress:
      type: object
      required: [totalFiles, processedFiles]
      properties:
        totalFiles: { type: integer, minimum: 0 }
        processedFiles: { type: integer, minimum: 0 }
    SyncDetachedPair:
      type: object
      required: [id, sourceRootName, destinationFolderName, createdAt]
      properties:
        id: { type: integer }
        sourceRootName: { type: string }
        destinationFolderName: { type: string }
        createdAt: { type: string, format: date-time }
    SyncDashboard:
      type: object
      required: [configured, running, inventory]
      properties:
        configured: { type: boolean }
        running: { type: boolean }
        inventory:
          oneOf:
            - $ref: "#/components/schemas/SyncInventoryTotals"
            - { type: "null" }
    SyncInventoryTotals:
      type: object
      required: [scannedAt, sourceFiles, sourceBytes, sourceUnknownSizeFiles, synchronizedFiles, synchronizedBytes, failedFiles, pendingFiles, notSynchronizedFiles]
      properties:
        scannedAt: { type: string, format: date-time }
        sourceFiles: { type: integer, minimum: 0 }
        sourceBytes: { type: integer, minimum: 0 }
        sourceUnknownSizeFiles: { type: integer, minimum: 0 }
        synchronizedFiles: { type: integer, minimum: 0 }
        synchronizedBytes: { type: integer, minimum: 0 }
        failedFiles: { type: integer, minimum: 0 }
        pendingFiles: { type: integer, minimum: 0 }
        notSynchronizedFiles: { type: integer, minimum: 0 }
        ignoredFiles: { type: integer, minimum: 0 }
        archivedFiles: { type: integer, minimum: 0 }
        archivedBytes: { type: number, minimum: 0 }
        ignoredBytes: { type: integer, minimum: 0 }
    SyncConfig:
      type: object
      required: [configured, destinationFolderId, destinationFolderName, sourceFolders, excludedFolders, enabled, pollIntervalSeconds, nextRunAt, providerCooldownUntil, lastRunAt, lastRunStatus, lastRunSummary, lastRunConflicts, lastRunError, detachedPairs]
      properties:
        treatArchivedAsDeleted: { type: boolean }
        configured: { type: boolean }
        ignoredFileCount: { type: integer, minimum: 0 }
        destinationFolderId: { type: ["string", "null"] }
        destinationFolderName: { type: ["string", "null"] }
        sourceFolders:
          type: array
          items: { $ref: "#/components/schemas/SyncSourceFolder" }
        excludedFolders:
          type: array
          items: { $ref: "#/components/schemas/SyncFolderExclusion" }
        enabled: { type: boolean }
        pollIntervalSeconds: { type: integer, enum: [1, 5, 30, 60, 300, 3600] }
        nextRunAt: { type: ["string", "null"], format: date-time }
        providerCooldownUntil: { type: ["string", "null"], format: date-time }
        lastRunAt: { type: ["string", "null"], format: date-time }
        lastRunStatus: { type: ["string", "null"], enum: [running, success, partial, failed, null] }
        lastRunSummary: { oneOf: [{ $ref: "#/components/schemas/SyncSummary" }, { type: "null" }] }
        lastRunConflicts:
          type: array
          items: { $ref: "#/components/schemas/SyncConflict" }
        lastRunError: { type: ["string", "null"] }
        detachedPairs:
          type: array
          items: { $ref: "#/components/schemas/SyncDetachedPair" }
    SyncConfigInput:
      type: object
      required: [destinationFolderId, destinationFolderName, sourceFolders, excludedFolders]
      properties:
        treatArchivedAsDeleted: { type: boolean }
        pollIntervalSeconds: { type: integer, enum: [1, 5, 30, 60, 300, 3600], default: 60 }
        destinationFolderId: { type: string, minLength: 1, maxLength: 500 }
        destinationFolderName: { type: string, minLength: 1, maxLength: 255 }
        sourceFolders:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/SyncSourceFolder" }
        excludedFolders:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/SyncFolderExclusion" }
    SyncPollingInput:
      type: object
      required: [pollIntervalSeconds]
      properties:
        pollIntervalSeconds: { type: integer, enum: [1, 5, 30, 60, 300, 3600] }
    SyncEnabledInput:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    ShufflrrItem:
      type: object
      required: [id, name, isFolder, size, modifiedAt, permissions]
