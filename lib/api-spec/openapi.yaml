openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /sync/config:
    get:
      operationId: getSyncConfig
      summary: Read the shared Shufflrr to SharePoint sync configuration
      responses:
        "200":
          description: Shared sync configuration and status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncConfig" }
        "401": { $ref: "#/components/responses/ShufflrrError" }
        "503": { $ref: "#/components/responses/ShufflrrError" }
    put:
      operationId: saveSyncConfig
      summary: Save the shared sync folders while sync is disabled
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncConfigInput" }
      responses:
        "200":
          description: Updated shared sync configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncConfig" }
        "400": { $ref: "#/components/responses/ShufflrrError" }
        "401": { $ref: "#/components/responses/ShufflrrError" }
        "409": { $ref: "#/components/responses/ShufflrrError" }
        "503": { $ref: "#/components/responses/ShufflrrError" }
  /sync/interval:
    put:
      operationId: setSyncInterval
      summary: Set the shared Shufflrr polling interval without changing folders
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncPollingInput" }
      responses:
        "200":
          description: Updated polling interval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncConfig" }
        "400": { $ref: "#/components/responses/ShufflrrError" }
        "401": { $ref: "#/components/responses/ShufflrrError" }
        "503": { $ref: "#/components/responses/ShufflrrError" }
  /sync/enabled:
    put:
      operationId: setSyncEnabled
      summary: Enable or pause scheduled synchronization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncEnabledInput" }
      responses:
        "200":
          description: Updated sync state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncConfig" }
        "400": { $ref: "#/components/responses/ShufflrrError" }
        "401": { $ref: "#/components/responses/ShufflrrError" }
        "503": { $ref: "#/components/responses/ShufflrrError" }
  /sync/orphans/{id}:
    delete:
      operationId: dismissSyncOrphan
      summary: Acknowledge and dismiss a detached sync pair notice
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { description: Notice dismissed }
        "401": { $ref: "#/components/responses/ShufflrrError" }
        "404": { $ref: "#/components/responses/ShufflrrError" }
        "503": { $ref: "#/components/responses/ShufflrrError" }
  /shufflrr/items:
    get:
      operationId: listShufflrrItems
      summary: List accessible roots or one Shufflrr folder
      parameters:
        - in: query
          name: folderId
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Folder listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShufflrrListing" }
        "400": { $ref: "#/components/responses/ShufflrrError" }
        "401": { $ref: "#/components/responses/ShufflrrError" }
        "403": { $ref: "#/components/responses/ShufflrrError" }
        "502": { $ref: "#/components/responses/ShufflrrError" }
        "503": { $ref: "#/components/responses/ShufflrrError" }
  /shufflrr/files/{id}/download:
    get:
      operationId: downloadShufflrrFile
      summary: Download an accessible file through the authenticated server
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: File bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/ShufflrrError" }
        "401": { $ref: "#/components/responses/ShufflrrError" }
        "403": { $ref: "#/components/responses/ShufflrrError" }
        "502": { $ref: "#/components/responses/ShufflrrError" }
        "503": { $ref: "#/components/responses/ShufflrrError" }
  /shufflrr/session/end:
    post:
      operationId: endShufflrrSession
      tags: [Shufflrr]
      summary: Discard the Shufflrr connection for the current authenticated app session
      responses:
        "204":
          description: Connection discarded or no connection existed
        "401":
          $ref: "#/components/responses/ShufflrrError"
        "403":
          $ref: "#/components/responses/ShufflrrError"
        "502":
          $ref: "#/components/responses/ShufflrrError"
  /shufflrr/test:
    post:
      operationId: testShufflrrAccess
      summary: Verify read/write/delete with isolated temporary items in a selected root
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ShufflrrProbeInput" }
      responses:
        "200":
          description: Scoped access report and cleanup status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ShufflrrAccessReport" }
        "400": { $ref: "#/components/responses/ShufflrrError" }
        "401": { $ref: "#/components/responses/ShufflrrError" }
        "403": { $ref: "#/components/responses/ShufflrrError" }
        "502": { $ref: "#/components/responses/ShufflrrError" }
        "503": { $ref: "#/components/responses/ShufflrrError" }
  /sharepoint/status:
    get:
      operationId: getConnectionStatus
      summary: Credential presence and fixed library target
      responses:
        "200":
          description: Configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectionStatus"
  /sharepoint/test:
    post:
      operationId: testConnection
      summary: Test authentication, site, library and file listing
      responses:
        "200":
          description: Diagnostic result including any access failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessReport"
  /sharepoint/items:
    get:
      operationId: listItems
      summary: Read a folder in the fixed library
      parameters:
        - in: query
          name: folderId
          schema: { type: string }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        "200":
          description: Folder listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FolderListing"
        "400":
          description: Invalid input
        "502":
          description: Access failed
  /sharepoint/folders:
    post:
      operationId: createSharePointFolder
      summary: Create a folder in the fixed library
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SharePointCreateFolderInput" }
      responses:
        "201":
          description: Created folder
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryItem" }
        "400": { description: Invalid folder name or destination }
        "401": { description: Sign-in required }
        "403": { description: SharePoint denied the operation }
        "409": { description: An item with that name already exists }
        "502": { description: SharePoint request failed }
  /sharepoint/items/{itemId}:
    patch:
      operationId: updateSharePointItem
      summary: Rename or move an item in the fixed library
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string, minLength: 1, maxLength: 500 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SharePointUpdateItemInput" }
      responses:
        "200":
          description: Updated item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LibraryItem" }
        "400": { description: Invalid update or destination }
        "401": { description: Sign-in required }
        "403": { description: SharePoint denied the operation }
        "404": { description: Item not found }
        "409": { description: An item with that name already exists }
        "502": { description: SharePoint request failed }
    delete:
      operationId: deleteSharePointItem
      summary: Delete an item from the fixed library
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "204": { description: Item deleted }
        "401": { description: Sign-in required }
        "403": { description: SharePoint denied the operation }
        "404": { description: Item not found }
        "502": { description: SharePoint request failed }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  responses:
    ShufflrrError:
      description: Safe request or provider failure
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ShufflrrRequestError" }
  schemas:
    ShufflrrRequestError:
      type: object
      required: [error, requestId]
      properties:
        error: { type: string }
        requestId: { type: string }
    SyncSourceFolder:
      type: object
      required: [id, name]
      properties:
        id: { type: integer, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 255 }
    SyncConflict:
      type: object
      required: [path, kind]
      properties:
        path: { type: string }
        kind: { type: string, enum: [path-conflict, untracked-sharepoint-item] }
    SyncSummary:
      type: object
      required: [createdFolders, copiedFiles, updatedFiles, deletedItems, conflicts]
      properties:
        createdFolders: { type: integer, minimum: 0 }
        copiedFiles: { type: integer, minimum: 0 }
        updatedFiles: { type: integer, minimum: 0 }
        deletedItems: { type: integer, minimum: 0 }
        conflicts: { type: integer, minimum: 0 }
    SyncDetachedPair:
      type: object
      required: [id, sourceRootName, destinationFolderName, createdAt]
      properties:
        id: { type: integer }
        sourceRootName: { type: string }
        destinationFolderName: { type: string }
        createdAt: { type: string, format: date-time }
    SyncConfig:
      type: object
      required: [configured, destinationFolderId, destinationFolderName, sourceFolders, enabled, pollIntervalSeconds, nextRunAt, lastRunAt, lastRunStatus, lastRunSummary, lastRunConflicts, lastRunError, detachedPairs]
      properties:
        configured: { type: boolean }
        destinationFolderId: { type: ["string", "null"] }
        destinationFolderName: { type: ["string", "null"] }
        sourceFolders:
          type: array
          items: { $ref: "#/components/schemas/SyncSourceFolder" }
        enabled: { type: boolean }
        pollIntervalSeconds: { type: integer, enum: [1, 5, 30, 60, 300, 3600] }
        nextRunAt: { type: ["string", "null"], format: date-time }
        lastRunAt: { type: ["string", "null"], format: date-time }
        lastRunStatus: { type: ["string", "null"], enum: [running, success, partial, failed, null] }
        lastRunSummary: { oneOf: [{ $ref: "#/components/schemas/SyncSummary" }, { type: "null" }] }
        lastRunConflicts:
          type: array
          items: { $ref: "#/components/schemas/SyncConflict" }
        lastRunError: { type: ["string", "null"] }
        detachedPairs:
          type: array
          items: { $ref: "#/components/schemas/SyncDetachedPair" }
    SyncConfigInput:
      type: object
      required: [destinationFolderId, destinationFolderName, sourceFolders]
      properties:
        pollIntervalSeconds: { type: integer, enum: [1, 5, 30, 60, 300, 3600], default: 60 }
        destinationFolderId: { type: string, minLength: 1, maxLength: 500 }
        destinationFolderName: { type: string, minLength: 1, maxLength: 255 }
        sourceFolders:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/SyncSourceFolder" }
    SyncPollingInput:
      type: object
      required: [pollIntervalSeconds]
      properties:
        pollIntervalSeconds: { type: integer, enum: [1, 5, 30, 60, 300, 3600] }
    SyncEnabledInput:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
    ShufflrrItem:
      type: object
      required: [id, name, isFolder, size, modifiedAt, permissions]
      properties:
        id: { type: integer }
        name: { type: string }
        isFolder: { type: boolean }
        size: { type: number }
        modifiedAt: { type: string }
        permissions: { type: string }
    ShufflrrListing:
      type: object
      required: [items, portalUrl]
      properties:
        portalUrl: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/ShufflrrItem" }
    ShufflrrProbeInput:
      type: object
      required: [rootFolderId, confirmTemporaryChanges]
      properties:
        rootFolderId: { type: integer, minimum: 1 }
        confirmTemporaryChanges: { type: boolean, enum: [true] }
    ShufflrrAccessReport:
      type: object
      required: [ok, checkedAt, scope, cleanupOk, steps, advice]
      properties:
        ok: { type: boolean }
        checkedAt: { type: string }
        scope: { type: string }
        cleanupOk: { type: boolean }
        steps:
          type: array
          items: { $ref: "#/components/schemas/DiagnosticStep" }
        advice:
          type: array
          items: { type: string }
    ConnectionStatus:
      type: object
      required: [configured, missing, libraryUrl, siteName, libraryName, productionBlocked]
      properties:
        configured: { type: boolean }
        missing: { type: array, items: { type: string } }
        libraryUrl: { type: string }
        siteName: { type: string }
        libraryName: { type: string }
        productionBlocked: { type: boolean }
    DiagnosticStep:
      type: object
      required: [name, status, message]
      properties:
        name: { type: string }
        status: { type: string, enum: [passed, failed, skipped] }
        message: { type: string }
        code: { type: string }
        requestId: { type: string }
    AccessReport:
      type: object
      required: [ok, checkedAt, steps, advice, permissions]
      properties:
        ok: { type: boolean }
        checkedAt: { type: string }
        steps:
          type: array
          items: { $ref: "#/components/schemas/DiagnosticStep" }
        advice: { type: array, items: { type: string } }
        permissions: { type: array, items: { type: string } }
    LibraryItem:
      type: object
      required: [id, name, isFolder, size, modifiedAt, webUrl]
      properties:
        id: { type: string }
        name: { type: string }
        isFolder: { type: boolean }
        size: { type: number }
        modifiedAt: { type: string }
        webUrl: { type: string }
    SharePointCreateFolderInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        parentId: { type: ["string", "null"], maxLength: 500 }
    SharePointUpdateItemInput:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        parentId: { type: ["string", "null"], maxLength: 500 }
    FolderListing:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/LibraryItem" }
        nextCursor: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

